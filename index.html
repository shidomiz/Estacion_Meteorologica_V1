<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoPro - Estación Meteorológica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body {
            background: linear-gradient(145deg, #1e293b, #0f172a);
        }
        /* Efecto de las tarjetas de la imagen (Glassmorphism oscuro y suave) */
        .meteo-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        /* Contenedor del arco solar */
        .sun-arc-container {
            position: relative;
            width: 100px;
            height: 50px;
            overflow: hidden;
        }
        .sun-arc {
            width: 100px;
            height: 100px;
            border: 3px dashed rgba(234, 179, 8, 0.3);
            border-bottom: none;
            border-radius: 100px 100px 0 0;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen font-sans flex justify-center items-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-slate-900/90 sm:rounded-[40px] shadow-2xl min-h-screen sm:min-h-[850px] p-6 flex flex-col justify-between border border-slate-800/80 relative overflow-hidden">
        
        <div class="space-y-6">
            <header class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-1">
                        Meteo<span class="text-slate-400 font-normal">Pro</span>
                        <span id="status-dot" class="h-2 w-2 rounded-full bg-amber-500 animate-pulse ml-1"></span>
                    </h1>
                    <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-location-dot text-indigo-400 mr-1"></i> Cañuelas</p>
                </div>
                <div class="text-right text-xs text-slate-400">
                    <p id="fecha-actual">21.6.2021</p>
                    <p id="hora-actual" class="font-semibold text-slate-300">13:15</p>
                </div>
            </header>

            <section class="space-y-2">
                <h3 class="text-xs font-bold tracking-wider uppercase text-slate-400 px-1">Estado Actual</h3>
                <div class="meteo-card rounded-3xl p-5 flex flex-col justify-between relative">
                    
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <i id="main-icon" class="fa-solid fa-cloud-sun text-5xl text-amber-400"></i>
                        </div>
                        <div class="text-right">
                            <h2 class="text-5xl font-light tracking-tight text-white inline-block" id="temp">22.8</h2>
                            <span class="text-xl font-light text-slate-400 align-top ml-1">°C</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-slate-800 text-left">
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase">Sensación</p>
                            <p class="text-xs font-semibold text-white mt-0.5" id="sensacion">23.5 °C</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase">Humedad</p>
                            <p class="text-xs font-semibold text-white mt-0.5" id="humedad">65%</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-slate-400 uppercase">Viento</p>
                            <p class="text-xs font-semibold text-white mt-0.5 flex items-center gap-1" id="viento">
                                14 km/h <span class="text-[10px] text-indigo-400 font-bold" id="viento-dir">NO</span>
                            </p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="space-y-2">
                <h3 class="text-xs font-bold tracking-wider uppercase text-slate-400 px-1">Sol y Alertas</h3>
                <div class="grid grid-cols-12 gap-3">
                    
                    <div class="col-span-7 meteo-card rounded-2xl p-4 flex items-center justify-between">
                        <div class="space-y-3 text-xs">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-cloud-sun text-amber-400"></i>
                                <div>
                                    <p class="text-[10px] text-slate-400">Amanecer</p>
                                    <p class="font-medium text-white" id="amanecer">06:48</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-cloud-moon text-indigo-400"></i>
                                <div>
                                    <p class="text-[10px] text-slate-400">Atardecer</p>
                                    <p class="font-medium text-white" id="atardecer">18:35</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="sun-arc-container mt-1">
                            <div class="sun-arc"></div>
                            <i class="fa-solid fa-sun text-amber-400 text-xs absolute top-[20px] left-[42px]"></i>
                        </div>
                    </div>

                    <div id="alert-card" class="col-span-5 bg-amber-500/10 border border-amber-500/20 rounded-2xl p-3 flex flex-col justify-center space-y-1">
                        <div class="flex items-center gap-1.5 text-amber-400 font-bold text-[10px] uppercase">
                            <i class="fa-solid fa-circle-exclamation text-xs"></i> Alerta
                        </div>
                        <p id="alert-text" class="text-[10px] leading-tight text-slate-300">Estable sin riesgos severos reportados.</p>
                    </div>

                </div>
            </section>

            <section class="space-y-2">
                <h3 class="text-xs font-bold tracking-wider uppercase text-slate-400 px-1">Calendario Semanal / Pronóstico de Riego</h3>
                
                <div class="grid grid-cols-5 gap-2" id="calendario-contenedor">
                    <div class="animate-pulse bg-slate-800/40 h-32 rounded-2xl"></div>
                </div>
            </section>
        </div>

        <nav class="meteo-card rounded-2xl mt-6 p-3 flex justify-around items-center text-slate-400">
            <button class="text-amber-400 text-lg"><i class="fa-solid fa-house"></i></button>
            <button class="hover:text-white transition text-lg"><i class="fa-solid fa-chart-simple"></i></button>
            <button class="hover:text-white transition text-lg"><i class="fa-solid fa-bell"></i></button>
            <button class="hover:text-white transition text-lg"><i class="fa-solid fa-gear"></i></button>
        </nav>

    </div>

    <script>
        // CONFIGURÁ ACÁ TUS CREDENCIALES DE HIVEMQ CLOUD
        const broker = 'wss://tu_broker.hivemq.cloud:8884/mqtt'; 
        const options = {
            username: 'tu_usuario',
            password: 'tu_password',
            clientId: 'meteo_pro_v3_' + Math.random().toString(16).substr(2, 8)
        };

        const client = mqtt.connect(broker, options);
        const statusDot = document.getElementById('status-dot');

        client.on('connect', () => {
            statusDot.className = "h-2 w-2 rounded-full bg-emerald-400 ml-1"; // Conectado (Verde)
            client.subscribe('estacion/clima');
        });

        client.on('close', () => {
            statusDot.className = "h-2 w-2 rounded-full bg-rose-500 ml-1 animate-pulse"; // Desconectado (Rojo)
        });

        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                actualizarInterfazCompleta(data);
            } catch (e) { console.error("Error procesando JSON de estación:", e); }
        });

        // Conversor de grados a siglas cardinales
        function getWindDirection(deg) {
            const index = Math.round(((deg %= 360) < 0 ? deg + 360 : deg) / 45) % 8;
            return ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][index];
        }

        function actualizarInterfazCompleta(data) {
            // Actualizar Fecha y Hora del reporte
            const ahora = new Date();
            document.getElementById('fecha-actual').innerText = `${ahora.getDate()}.${ahora.getMonth()+1}.${ahora.getFullYear()}`;
            document.getElementById('hora-actual').innerText = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // Panel Actual
            document.getElementById('temp').innerText = data.current.temperature_2m.toFixed(1);
            document.getElementById('sensacion').innerText = `${(data.current.temperature_2m + 0.7).toFixed(1)} °C`; // Estimación de sensación
            document.getElementById('humedad').innerText = `${data.current.relative_humidity_2m || 65}%`;
            document.getElementById('viento').innerHTML = `${Math.round(data.current.wind_speed_10m)} km/h <span class="text-[10px] text-indigo-400 font-bold" id="viento-dir">${getWindDirection(data.current.wind_direction_10m)}</span>`;

            // Soles
            document.getElementById('amanecer').innerText = data.daily.sunrise[0].split('T')[1];
            document.getElementById('atardecer').innerText = data.daily.sunset[0].split('T')[1];

            // Gestión Dinámica de Alertas en Base al Clima
            const alertCard = document.getElementById('alert-card');
            const alertText = document.getElementById('alert-text');
            
            if(data.current.wind_speed_10m > 25) {
                alertCard.className = "col-span-5 bg-rose-500/10 border border-rose-500/20 rounded-2xl p-3 flex flex-col justify-center space-y-1 text-rose-400";
                alertText.innerText = "ALERTA: Vientos moderados / fuertes en la zona.";
            } else if(data.daily.precipitation_probability_max[0] > 60) {
                alertCard.className = "col-span-5 bg-amber-500/10 border border-amber-500/20 rounded-2xl p-3 flex flex-col justify-center space-y-1 text-amber-400";
                alertText.innerText = "ALERTA: Probabilidad de tormentas esta tarde.";
            } else {
                alertCard.className = "col-span-5 bg-slate-800/40 border border-slate-700/30 rounded-2xl p-3 flex flex-col justify-center space-y-1 text-slate-400";
                alertText.innerText = "Condiciones normales sin alertas activas.";
            }

            // Renderizar los 5 Días del Calendario / Riego de la Imagen
            const contenedorSemana = document.getElementById('calendario-contenedor');
            contenedorSemana.innerHTML = ''; // Limpiar preexistentes

            for(let i = 0; i < 5; i++) {
                const fecha = new Date(data.daily.time[i] + 'T00:00:00');
                const diasSemana = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
                const nombreDia = diasSemana[fecha.getDay()];
                const numeroDia = fecha.getDate();

                const probRain = data.daily.precipitation_probability_max[i];
                
                // Determinar regla de riego e icono estético
                let riegoTexto = "Óptimo";
                let riegoColorClass = "bg-emerald-500";
                let iconClass = "fa-sun text-amber-400";

                if (probRain > 20 && probRain <= 50) {
                    riegoTexto = "Evitar";
                    riegoColorClass = "bg-amber-500";
                    iconClass = "fa-cloud-sun text-slate-400";
                } else if (probRain > 50) {
                    riegoTexto = "Evitar";
                    riegoColorClass = "bg-rose-500";
                    iconClass = "fa-cloud-showers-heavy text-sky-400";
                }

                // Generar tarjeta vertical exacta a la foto
                contenedorSemana.innerHTML += `
                    <div class="meteo-card rounded-2xl p-2.5 flex flex-col items-center justify-between text-center border ${i === 2 ? 'border-amber-500/60 ring-1 ring-amber-500/20' : 'border-transparent'}">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 tracking-wide">${nombreDia} <span class="text-[9px] font-normal opacity-60">${numeroDia}</span></p>
                            <i class="fa-solid ${iconClass} text-lg my-2.5 block"></i>
                            <p class="text-[9px] text-sky-400 font-medium flex items-center justify-center gap-0.5">
                                <i class="fa-solid fa-droplet text-[8px]"></i> ${probRain}%
                            </p>
                        </div>
                        
                        <div class="w-full mt-3">
                            <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                                <div class="${riegoColorClass} h-full" style="width: 70%"></div>
                            </div>
                            <p class="text-[7px] uppercase tracking-tighter text-slate-400 mt-1 font-bold">Riego: ${riegoTexto}</p>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
